<svg xmlns="http://www.w3.org/2000/svg" width="650" height="165" viewBox="0 0 650 165" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0D1A"/>
      <stop offset="50%" stop-color="#141126"/>
      <stop offset="100%" stop-color="#080810"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#00FFFF"/>
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="card1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241B0E"/>
      <stop offset="100%" stop-color="#120D05"/>
    </linearGradient>
    <linearGradient id="card2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0C2538"/>
      <stop offset="100%" stop-color="#06121C"/>
    </linearGradient>
    <linearGradient id="card3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#231338"/>
      <stop offset="100%" stop-color="#11081C"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FFD700" flood-opacity="0.3"/>
    </filter>

    <style>
      .font-header { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 11px; font-weight: 900; letter-spacing: 2px; fill: #FFD700; }
      .font-title { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 11.5px; font-weight: 800; letter-spacing: 0.6px; fill: #FFFFFF; }
      .font-sub { font-family: 'Consolas', monospace; font-size: 9.5px; fill: #94A3B8; }
      .font-pill { font-family: 'Consolas', monospace; font-size: 8.5px; font-weight: 700; fill: #000000; }
      .font-footer { font-family: 'Consolas', monospace; font-size: 9.5px; fill: #7E869B; letter-spacing: 1px; }
    </style>
  </defs>

  <!-- Main Container Frame -->
  <rect x="1.5" y="1.5" width="647" height="162" rx="14" fill="url(#panelBg)" stroke="url(#goldBorder)" stroke-width="1.5"/>

  <!-- Top SAO Banner -->
  <g transform="translate(20, 14)">
    <polygon points="0,0 12,18 200,18 212,0" fill="#FFD700" opacity="0.15"/>
    <rect x="0" y="0" width="610" height="20" rx="4" fill="#1C1833" stroke="#8A2BE2" stroke-width="0.8"/>
    <!-- Left Indicator Dot -->
    <circle cx="12" cy="10" r="3.5" fill="#FFD700" filter="url(#goldGlow)"/>
    <text x="24" y="14" class="font-header">◆ CONGRATULATIONS // BOSS DEFEATED — FLOOR 100 RUBY PALACE ◆</text>
    <rect x="530" y="3" width="70" height="14" rx="3" fill="#FFD700"/>
    <text x="565" y="13.5" class="font-pill" text-anchor="middle" font-weight="900">CLEARED</text>
  </g>

  <!-- 3 Holographic Loot & Reward Panels -->
  <!-- Panel 1: Last Attack Bonus -->
  <g transform="translate(20, 44)">
    <rect width="195" height="82" rx="8" fill="url(#card1)" stroke="#FF8C00" stroke-width="1.2"/>
    <!-- Rank Pill -->
    <rect x="12" y="8" width="85" height="14" rx="4" fill="#FFD700"/>
    <text x="54.5" y="18.5" class="font-pill" text-anchor="middle">LAST ATTACK</text>
    <!-- Vector Trophy/Crown -->
    <circle cx="165" cy="22" r="13" fill="#3D290A" stroke="#FFD700" stroke-width="0.8"/>
    <path d="M165 14 L167.5 19.5 L173 19.5 L168.5 23 L170.2 28.5 L165 25 L159.8 28.5 L161.5 23 L157 19.5 L162.5 19.5 Z" fill="#FFD700"/>
    <!-- Item Title -->
    <text x="12" y="42" class="font-title">Coat of Midnight</text>
    <text x="12" y="57" class="font-sub">Rarity: Divine Artifact</text>
    <text x="12" y="70" class="font-sub" fill="#F59E0B">Perk: System Cloak +100%</text>
  </g>

  <!-- Panel 2: Unlocked Secret Skill -->
  <g transform="translate(227, 44)">
    <rect width="195" height="82" rx="8" fill="url(#card2)" stroke="#00FFFF" stroke-width="1.2"/>
    <!-- Rank Pill -->
    <rect x="12" y="8" width="85" height="14" rx="4" fill="#00FFFF"/>
    <text x="54.5" y="18.5" class="font-pill" text-anchor="middle">UNIQUE SKILL</text>
    <!-- Vector Crossed Swords -->
    <circle cx="165" cy="22" r="13" fill="#0E2D40" stroke="#00FFFF" stroke-width="0.8"/>
    <line x1="158" y1="29" x2="172" y2="15" stroke="#00FFFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="172" y1="29" x2="158" y2="15" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <!-- Item Title -->
    <text x="12" y="42" class="font-title">Dual Blades [二刀流]</text>
    <text x="12" y="57" class="font-sub">Skill: Starburst Stream</text>
    <text x="12" y="70" class="font-sub" fill="#00FFFF">Combo: 16-Hit Finisher</text>
  </g>

  <!-- Panel 3: Solo Beater Status -->
  <g transform="translate(435, 44)">
    <rect width="195" height="82" rx="8" fill="url(#card3)" stroke="#C084FC" stroke-width="1.2"/>
    <!-- Rank Pill -->
    <rect x="12" y="8" width="85" height="14" rx="4" fill="#C084FC"/>
    <text x="54.5" y="18.5" class="font-pill" text-anchor="middle">SOLO TITLE</text>
    <!-- Vector Shield / Eye -->
    <circle cx="165" cy="22" r="13" fill="#2E174A" stroke="#C084FC" stroke-width="0.8"/>
    <path d="M165 15 L171 18 V23 C171 27 168 29.5 165 31 C162 29.5 159 27 159 23 V18 Z" fill="#C084FC"/>
    <!-- Item Title -->
    <text x="12" y="42" class="font-title">The Solo Beater</text>
    <text x="12" y="57" class="font-sub">Party: 1 Player [Solo]</text>
    <text x="12" y="70" class="font-sub" fill="#C084FC">Survival Rate: 100%</text>
  </g>

  <!-- Bottom Telemetry Bar -->
  <g transform="translate(20, 145)">
    <line x1="0" y1="0" x2="610" y2="0" stroke="#251E3D" stroke-width="1"/>
    <text x="0" y="13" class="font-footer">EXP: +14,500,000</text>
    <text x="160" y="13" class="font-footer">COL: +99,999,999</text>
    <text x="340" y="13" class="font-footer">STATUS: IMMORTAL OBJECT OVERRIDE</text>
    <text x="610" y="13" class="font-footer" text-anchor="end" fill="#00FFFF">[COMPLETE]</text>
  </g>
</svg>
