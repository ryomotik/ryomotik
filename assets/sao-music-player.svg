<svg xmlns="http://www.w3.org/2000/svg" width="680" height="150" viewBox="0 0 680 150" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d14"/>
      <stop offset="50%" stop-color="#121124"/>
      <stop offset="100%" stop-color="#090a10"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A2BE2"/>
      <stop offset="50%" stop-color="#00FFFF"/>
      <stop offset="100%" stop-color="#9945FF"/>
    </linearGradient>

    <!-- Progress Bar Gradient -->
    <linearGradient id="progGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928CA"/>
      <stop offset="50%" stop-color="#9B51E0"/>
      <stop offset="100%" stop-color="#00FFFF"/>
    </linearGradient>

    <!-- Vinyl Disc Gradient -->
    <radialGradient id="discGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1230"/>
      <stop offset="60%" stop-color="#0d0e17"/>
      <stop offset="90%" stop-color="#1e1838"/>
      <stop offset="100%" stop-color="#2a2048"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8A2BE2" flood-opacity="0.3"/>
    </filter>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes bounce1 { 0%, 100% { height: 6px; y: 24px; } 50% { height: 26px; y: 4px; } }
      @keyframes bounce2 { 0%, 100% { height: 24px; y: 6px; } 50% { height: 8px; y: 22px; } }
      @keyframes bounce3 { 0%, 100% { height: 12px; y: 18px; } 50% { height: 28px; y: 2px; } }
      @keyframes bounce4 { 0%, 100% { height: 28px; y: 2px; } 50% { height: 8px; y: 22px; } }
      @keyframes bounce5 { 0%, 100% { height: 16px; y: 14px; } 50% { height: 26px; y: 4px; } }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes pulse { 0%, 100% { opacity: 0.85; } 50% { opacity: 1; filter: drop-shadow(0 0 6px #00FFFF); } }
      
      .bar1 { animation: bounce1 1.05s ease-in-out infinite; }
      .bar2 { animation: bounce2 0.85s ease-in-out infinite; }
      .bar3 { animation: bounce3 1.25s ease-in-out infinite; }
      .bar4 { animation: bounce4 0.95s ease-in-out infinite; }
      .bar5 { animation: bounce5 1.15s ease-in-out infinite; }
      .vinyl { transform-origin: 65px 75px; animation: spin 8s linear infinite; }
      .glowing-dot { animation: pulse 2s ease-in-out infinite; }
      .text-title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #FFFFFF; letter-spacing: 0.5px; }
      .text-sub { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 12px; font-weight: 400; fill: #C084FC; }
      .text-meta { font-family: 'Consolas', monospace; font-size: 11px; fill: #7E869B; }
      .text-controls { font-family: sans-serif; font-size: 17px; fill: #BB86FC; user-select: none; }
    </style>
  </defs>

  <!-- Outer Card Frame -->
  <rect x="2" y="2" width="676" height="146" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.6" filter="url(#shadow)"/>

  <!-- Left: Vinyl / Disc Album -->
  <g class="vinyl">
    <circle cx="65" cy="75" r="44" fill="url(#discGrad)" stroke="#4A3B69" stroke-width="2"/>
    <circle cx="65" cy="75" r="32" fill="none" stroke="#251E3D" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="65" cy="75" r="22" fill="none" stroke="#352B55" stroke-width="1"/>
    <!-- Center Label -->
    <circle cx="65" cy="75" r="14" fill="#8A2BE2"/>
    <circle cx="65" cy="75" r="5" fill="#0c0d14"/>
  </g>
  <!-- Mini Swords Badge inside disc -->
  <text x="65" y="79" font-size="11" text-anchor="middle" fill="#FFFFFF">⚔️</text>

  <!-- Equalizer Visualizer (Top Right) -->
  <g transform="translate(615, 20)">
    <rect class="bar1" x="0" y="24" width="3.5" height="6" rx="1.5" fill="#00FFFF"/>
    <rect class="bar2" x="7" y="6" width="3.5" height="24" rx="1.5" fill="#8A2BE2"/>
    <rect class="bar3" x="14" y="18" width="3.5" height="12" rx="1.5" fill="#C084FC"/>
    <rect class="bar4" x="21" y="2" width="3.5" height="28" rx="1.5" fill="#00FFFF"/>
    <rect class="bar5" x="28" y="14" width="3.5" height="16" rx="1.5" fill="#9945FF"/>
  </g>

  <!-- Track Info -->
  <g transform="translate(130, 26)">
    <!-- High-Res Audio Badge -->
    <rect x="0" y="0" width="138" height="18" rx="4" fill="#1C1833" stroke="#8A2BE2" stroke-width="0.8"/>
    <text x="6" y="13" font-family="'Consolas', monospace" font-size="9" font-weight="700" fill="#00FFFF">▶ NOW PLAYING • HI-RES</text>

    <!-- Track Title -->
    <text x="0" y="42" class="text-title">Yuki Kajiura — 「 Swordland 」</text>
    <text x="0" y="60" class="text-sub">Sword Art Online: Aincrad Battle OST • Floor 100 Theme</text>
  </g>

  <!-- Progress Bar Container -->
  <g transform="translate(130, 96)">
    <!-- Time Current -->
    <text x="0" y="11" class="text-meta">01:43</text>

    <!-- Progress Track Background -->
    <rect x="38" y="5" width="440" height="5" rx="2.5" fill="#1A1C2E"/>
    <!-- Progress Filled -->
    <rect x="38" y="5" width="240" height="5" rx="2.5" fill="url(#progGrad)"/>
    <!-- Glowing Progress Thumb/Dot -->
    <circle class="glowing-dot" cx="278" cy="7.5" r="5" fill="#00FFFF" filter="url(#cyanGlow)"/>

    <!-- Time Total -->
    <text x="488" y="11" class="text-meta">03:15</text>
  </g>

  <!-- Player Controls (Center Bottom) -->
  <g transform="translate(300, 134)" text-anchor="middle">
    <!-- Shuffle -->
    <text x="-65" y="0" class="text-controls" font-size="14" fill="#7E869B">🔀</text>
    <!-- Previous -->
    <text x="-32" y="0" class="text-controls" font-size="15" fill="#A855F7">⏮</text>
    <!-- Pause (Active Playing) with circular glow plate -->
    <circle cx="0" cy="-5" r="12" fill="#8A2BE2" opacity="0.3"/>
    <circle cx="0" cy="-5" r="10" fill="#1A1535" stroke="#00FFFF" stroke-width="1.2"/>
    <text x="0" y="0" class="text-controls" font-size="13" font-weight="bold" fill="#00FFFF">❚❚</text>
    <!-- Next -->
    <text x="32" y="0" class="text-controls" font-size="15" fill="#A855F7">⏭</text>
    <!-- Repeat -->
    <text x="65" y="0" class="text-controls" font-size="14" fill="#00FFFF">🔁</text>
  </g>
</svg>
