<svg xmlns="http://www.w3.org/2000/svg" width="650" height="135" viewBox="0 0 650 135" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="deckBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F1A"/>
      <stop offset="50%" stop-color="#141126"/>
      <stop offset="100%" stop-color="#0A0A10"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A2BE2"/>
      <stop offset="50%" stop-color="#00FFFF"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Progress Gradient -->
    <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928CA"/>
      <stop offset="60%" stop-color="#9B51E0"/>
      <stop offset="100%" stop-color="#00FFFF"/>
    </linearGradient>

    <radialGradient id="vinylCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#24143D"/>
      <stop offset="70%" stop-color="#0E0C17"/>
      <stop offset="100%" stop-color="#1C1830"/>
    </radialGradient>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes spinVinyl { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes eq1 { 0%, 100% { height: 6px; y: 22px; } 50% { height: 26px; y: 2px; } }
      @keyframes eq2 { 0%, 100% { height: 22px; y: 6px; } 50% { height: 8px; y: 20px; } }
      @keyframes eq3 { 0%, 100% { height: 10px; y: 18px; } 50% { height: 28px; y: 0px; } }
      @keyframes eq4 { 0%, 100% { height: 26px; y: 2px; } 50% { height: 6px; y: 22px; } }
      @keyframes eq5 { 0%, 100% { height: 14px; y: 14px; } 50% { height: 24px; y: 4px; } }
      @keyframes pulseGlow { 0%, 100% { opacity: 0.8; } 50% { opacity: 1; filter: drop-shadow(0 0 5px #00FFFF); } }
      
      .spin { transform-origin: 60px 67.5px; animation: spinVinyl 6s linear infinite; }
      .bar-a { animation: eq1 1.0s ease-in-out infinite; }
      .bar-b { animation: eq2 0.8s ease-in-out infinite; }
      .bar-c { animation: eq3 1.2s ease-in-out infinite; }
      .bar-d { animation: eq4 0.9s ease-in-out infinite; }
      .bar-e { animation: eq5 1.1s ease-in-out infinite; }
      .thumb { animation: pulseGlow 2s ease-in-out infinite; }

      .song-title { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 15px; font-weight: 800; fill: #FFFFFF; letter-spacing: 0.5px; }
      .song-desc { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 11.5px; font-weight: 500; fill: #C084FC; }
      .time-code { font-family: 'Consolas', monospace; font-size: 10.5px; fill: #6B7280; }
    </style>
  </defs>

  <!-- Frame with neon outline -->
  <rect x="1.5" y="1.5" width="647" height="132" rx="14" fill="url(#deckBg)" stroke="url(#neonBorder)" stroke-width="1.5"/>

  <!-- Left: Animated Vinyl Disc -->
  <g class="spin">
    <circle cx="60" cy="67.5" r="42" fill="url(#vinylCenter)" stroke="#3B2A59" stroke-width="2"/>
    <circle cx="60" cy="67.5" r="30" fill="none" stroke="#221C38" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="60" cy="67.5" r="20" fill="none" stroke="#2D234A" stroke-width="1"/>
    <!-- Center Core -->
    <circle cx="60" cy="67.5" r="13" fill="#8A2BE2"/>
    <circle cx="60" cy="67.5" r="4" fill="#0A0A10"/>
    <!-- Crossed Swords Vector Logo inside center -->
    <line x1="53" y1="74.5" x2="67" y2="60.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="67" y1="74.5" x2="53" y2="60.5" stroke="#00FFFF" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Equalizer Bars (Top Right) -->
  <g transform="translate(585, 20)">
    <rect class="bar-a" x="0" y="14" width="3.5" height="14" rx="1.5" fill="#00FFFF"/>
    <rect class="bar-b" x="7" y="6" width="3.5" height="22" rx="1.5" fill="#8A2BE2"/>
    <rect class="bar-c" x="14" y="16" width="3.5" height="12" rx="1.5" fill="#C084FC"/>
    <rect class="bar-d" x="21" y="2" width="3.5" height="26" rx="1.5" fill="#00FFFF"/>
    <rect class="bar-e" x="28" y="10" width="3.5" height="18" rx="1.5" fill="#A855F7"/>
  </g>

  <!-- Track Information -->
  <g transform="translate(122, 22)">
    <!-- High-Res Pill -->
    <rect x="0" y="0" width="132" height="17" rx="4" fill="#1C1833" stroke="#8A2BE2" stroke-width="0.8"/>
    <polygon points="8,4.5 8,12.5 14,8.5" fill="#00FFFF"/>
    <text x="18" y="12" font-family="'Consolas', monospace" font-size="9" font-weight="700" fill="#00FFFF">NOW PLAYING • HI-RES</text>

    <!-- Title and Subtitle -->
    <text x="0" y="38" class="song-title">Yuki Kajiura — 「 Swordland 」</text>
    <text x="0" y="55" class="song-desc">Sword Art Online: Aincrad Battle OST • Floor 100 Theme</text>
  </g>

  <!-- Progress Bar Container -->
  <g transform="translate(122, 88)">
    <text x="0" y="7" class="time-code">01:43</text>
    <!-- Background Track -->
    <rect x="36" y="2" width="418" height="5" rx="2.5" fill="#1E1C2E"/>
    <!-- Filled Progress -->
    <rect x="36" y="2" width="224" height="5" rx="2.5" fill="url(#progressGrad)"/>
    <!-- Glowing Playhead Thumb -->
    <circle class="thumb" cx="260" cy="4.5" r="4.5" fill="#00FFFF" filter="url(#cyanGlow)"/>
    <text x="464" y="7" class="time-code">03:15</text>
  </g>

  <!-- Vector Media Controls (Bottom Center) -->
  <g transform="translate(325, 120)">
    <!-- Shuffle (Arrows crossed) -->
    <g transform="translate(-55, -8)">
      <path d="M0 12 L6 6 M0 0 L6 6 L12 0 M6 6 L12 12 M9 0 L12 0 L12 3 M9 12 L12 12 L12 9" stroke="#6B7280" stroke-width="1.3" stroke-linecap="round" fill="none"/>
    </g>
    <!-- Previous (Dual Left Triangles) -->
    <g transform="translate(-25, -7)">
      <polygon points="12,0 3,5.5 12,11" fill="#A855F7"/>
      <polygon points="5,0 -4,5.5 5,11" fill="#A855F7"/>
    </g>
    <!-- Pause Button Circle Plate -->
    <g transform="translate(0, -2)">
      <circle cx="0" cy="0" r="11" fill="#1B1736" stroke="#00FFFF" stroke-width="1.2"/>
      <rect x="-4" y="-5" width="2.8" height="10" rx="1" fill="#00FFFF"/>
      <rect x="1.2" y="-5" width="2.8" height="10" rx="1" fill="#00FFFF"/>
    </g>
    <!-- Next (Dual Right Triangles) -->
    <g transform="translate(25, -7)">
      <polygon points="-4,0 5,5.5 -4,11" fill="#A855F7"/>
      <polygon points="3,0 12,5.5 3,11" fill="#A855F7"/>
    </g>
    <!-- Repeat (Loop Arrow) -->
    <g transform="translate(55, -8)">
      <path d="M0 6 A5 5 0 0 1 10 3 L12 0 M12 6 A5 5 0 0 1 2 9 L0 12" stroke="#00FFFF" stroke-width="1.3" stroke-linecap="round" fill="none"/>
    </g>
  </g>
</svg>
