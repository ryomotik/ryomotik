<svg xmlns="http://www.w3.org/2000/svg" width="780" height="140" viewBox="0 0 780 140" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16152B"/>
      <stop offset="100%" stop-color="#0B0B14"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFFF"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8B4FE"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D8D"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#8A2BE2" flood-opacity="0.25"/>
    </filter>

    <style>
      @keyframes floatCard { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
      .c1 { animation: floatCard 3.2s ease-in-out infinite; }
      .c2 { animation: floatCard 2.8s ease-in-out infinite 0.4s; }
      .c3 { animation: floatCard 3.5s ease-in-out infinite 0.8s; }
      .c4 { animation: floatCard 3.0s ease-in-out infinite 0.2s; }
      .c5 { animation: floatCard 3.3s ease-in-out infinite 0.6s; }
      .title-text { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 11px; font-weight: 800; letter-spacing: 0.5px; fill: #FFFFFF; text-anchor: middle; }
      .sub-text { font-family: 'Consolas', monospace; font-size: 9.5px; fill: #94A3B8; text-anchor: middle; }
      .rank-text { font-family: 'Impact', sans-serif; font-size: 11px; font-weight: bold; fill: #0B0B14; text-anchor: middle; }
    </style>
  </defs>

  <!-- TROPHY 1: FLOOR 100 CONQUEROR -->
  <g class="c1" transform="translate(10, 8)" filter="url(#glow)">
    <rect width="144" height="120" rx="12" fill="url(#cardBg)" stroke="#F59E0B" stroke-width="1.4"/>
    <!-- Rank Badge -->
    <rect x="44" y="-7" width="56" height="16" rx="8" fill="url(#goldGrad)"/>
    <text x="72" y="5" class="rank-text">SSS RANK</text>
    <!-- Icon -->
    <circle cx="72" cy="38" r="18" fill="#2E2310" stroke="#F59E0B" stroke-width="1"/>
    <text x="72" y="44" font-size="20" text-anchor="middle">👑</text>
    <!-- Titles -->
    <text x="72" y="74" class="title-text">FLOOR CLEARER</text>
    <text x="72" y="90" class="sub-text">Floor 100 Beater</text>
    <rect x="22" y="102" width="100" height="3" rx="1.5" fill="#F59E0B" opacity="0.8"/>
  </g>

  <!-- TROPHY 2: DUAL BLADES MASTERY -->
  <g class="c2" transform="translate(164, 8)" filter="url(#glow)">
    <rect width="144" height="120" rx="12" fill="url(#cardBg)" stroke="#00FFFF" stroke-width="1.4"/>
    <!-- Rank Badge -->
    <rect x="46" y="-7" width="52" height="16" rx="8" fill="url(#cyanGrad)"/>
    <text x="72" y="5" class="rank-text">MAX TIER</text>
    <!-- Icon -->
    <circle cx="72" cy="38" r="18" fill="#0D2738" stroke="#00FFFF" stroke-width="1"/>
    <text x="72" y="44" font-size="18" text-anchor="middle">⚔️</text>
    <!-- Titles -->
    <text x="72" y="74" class="title-text">DUAL BLADES</text>
    <text x="72" y="90" class="sub-text">Starburst Stream</text>
    <rect x="22" y="102" width="100" height="3" rx="1.5" fill="#00FFFF" opacity="0.8"/>
  </g>

  <!-- TROPHY 3: EXPLOIT ARCHITECT -->
  <g class="c3" transform="translate(318, 8)" filter="url(#glow)">
    <rect width="144" height="120" rx="12" fill="url(#cardBg)" stroke="#8A2BE2" stroke-width="1.4"/>
    <!-- Rank Badge -->
    <rect x="46" y="-7" width="52" height="16" rx="8" fill="url(#purpleGrad)"/>
    <text x="72" y="5" class="rank-text">GOD TIER</text>
    <!-- Icon -->
    <circle cx="72" cy="38" r="18" fill="#24133B" stroke="#8A2BE2" stroke-width="1"/>
    <text x="72" y="44" font-size="18" text-anchor="middle">⚡</text>
    <!-- Titles -->
    <text x="72" y="74" class="title-text">LUAU ARCHITECT</text>
    <text x="72" y="90" class="sub-text">Undetected Core</text>
    <rect x="22" y="102" width="100" height="3" rx="1.5" fill="#8A2BE2" opacity="0.8"/>
  </g>

  <!-- TROPHY 4: CARDINAL OVERRIDE -->
  <g class="c4" transform="translate(472, 8)" filter="url(#glow)">
    <rect width="144" height="120" rx="12" fill="url(#cardBg)" stroke="#FF007F" stroke-width="1.4"/>
    <!-- Rank Badge -->
    <rect x="46" y="-7" width="52" height="16" rx="8" fill="url(#crimsonGrad)"/>
    <text x="72" y="5" class="rank-text">S+ CLASS</text>
    <!-- Icon -->
    <circle cx="72" cy="38" r="18" fill="#301124" stroke="#FF007F" stroke-width="1"/>
    <text x="72" y="44" font-size="18" text-anchor="middle">🛡️</text>
    <!-- Titles -->
    <text x="72" y="74" class="title-text">SYSTEM BYPASS</text>
    <text x="72" y="90" class="sub-text">Zero-Trace Hook</text>
    <rect x="22" y="102" width="100" height="3" rx="1.5" fill="#FF007F" opacity="0.8"/>
  </g>

  <!-- TROPHY 5: DIVINE OBJECT FORGER -->
  <g class="c5" transform="translate(626, 8)" filter="url(#glow)">
    <rect width="144" height="120" rx="12" fill="url(#cardBg)" stroke="#34D399" stroke-width="1.4"/>
    <!-- Rank Badge -->
    <rect x="44" y="-7" width="56" height="16" rx="8" fill="url(#emeraldGrad)"/>
    <text x="72" y="5" class="rank-text">MYTHIC</text>
    <!-- Icon -->
    <circle cx="72" cy="38" r="18" fill="#0E2E22" stroke="#34D399" stroke-width="1"/>
    <text x="72" y="44" font-size="18" text-anchor="middle">💎</text>
    <!-- Titles -->
    <text x="72" y="74" class="title-text">DIVINE FORGER</text>
    <text x="72" y="90" class="sub-text">Elucidator +50</text>
    <rect x="22" y="102" width="100" height="3" rx="1.5" fill="#34D399" opacity="0.8"/>
  </g>
</svg>
