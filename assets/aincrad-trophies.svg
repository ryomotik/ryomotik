<svg xmlns="http://www.w3.org/2000/svg" width="650" height="135" viewBox="0 0 650 135" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141426"/>
      <stop offset="100%" stop-color="#0A0A12"/>
    </linearGradient>

    <!-- Glowing Gradients -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>

    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFFF"/>
      <stop offset="100%" stop-color="#0080FF"/>
    </linearGradient>

    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <linearGradient id="crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E93"/>
      <stop offset="100%" stop-color="#990033"/>
    </linearGradient>

    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FFD700" flood-opacity="0.35"/>
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00FFFF" flood-opacity="0.35"/>
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#8A2BE2" flood-opacity="0.35"/>
    </filter>
    <filter id="glowCrimson" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FF2E93" flood-opacity="0.35"/>
    </filter>

    <style>
      @keyframes floatCard { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
      .slot1 { animation: floatCard 3.4s ease-in-out infinite; }
      .slot2 { animation: floatCard 3.0s ease-in-out infinite 0.5s; }
      .slot3 { animation: floatCard 3.6s ease-in-out infinite 1.0s; }
      .slot4 { animation: floatCard 3.2s ease-in-out infinite 0.2s; }
      .tag-text { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 9px; font-weight: 800; letter-spacing: 0.8px; text-anchor: middle; fill: #FFFFFF; }
      .main-title { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; fill: #FFFFFF; text-anchor: middle; }
      .sub-title { font-family: 'Consolas', monospace; font-size: 9px; fill: #8E9AB0; text-anchor: middle; }
    </style>
  </defs>

  <!-- ==================== SLOT 1: FLOOR 100 CLEARER ==================== -->
  <g class="slot1" transform="translate(10, 10)">
    <rect width="145" height="115" rx="10" fill="url(#cardBg)" stroke="#FF8C00" stroke-width="1.3" filter="url(#glowGold)"/>
    <!-- Rank Pill -->
    <rect x="36" y="8" width="73" height="16" rx="8" fill="url(#gold)"/>
    <text x="72.5" y="19.5" class="tag-text" fill="#0A0A12">SSS CLEAR</text>
    <!-- Vector Crown/Star Trophy -->
    <circle cx="72.5" cy="48" r="16" fill="#241B0E" stroke="#FFD700" stroke-width="0.8"/>
    <path d="M72.5 37 L75.8 44.5 L83.5 44.5 L77.2 49.3 L79.6 57 L72.5 52 L65.4 57 L67.8 49.3 L61.5 44.5 L69.2 44.5 Z" fill="url(#gold)"/>
    <!-- Labels -->
    <text x="72.5" y="78" class="main-title">FLOOR 100 BOSS</text>
    <text x="72.5" y="93" class="sub-title">Ruby Palace Clearer</text>
    <rect x="22" y="103" width="101" height="2" rx="1" fill="#FF8C00"/>
  </g>

  <!-- ==================== SLOT 2: DUAL BLADES ==================== -->
  <g class="slot2" transform="translate(170, 10)">
    <rect width="145" height="115" rx="10" fill="url(#cardBg)" stroke="#00FFFF" stroke-width="1.3" filter="url(#glowCyan)"/>
    <!-- Rank Pill -->
    <rect x="36" y="8" width="73" height="16" rx="8" fill="url(#cyan)"/>
    <text x="72.5" y="19.5" class="tag-text" fill="#0A0A12">MAX SKILL</text>
    <!-- Vector Crossed Swords -->
    <circle cx="72.5" cy="48" r="16" fill="#092233" stroke="#00FFFF" stroke-width="0.8"/>
    <!-- Sword 1 -->
    <line x1="63" y1="58" x2="82" y2="38" stroke="#00FFFF" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="60" y1="55" x2="66" y2="61" stroke="#00FFFF" stroke-width="2"/>
    <!-- Sword 2 -->
    <line x1="82" y1="58" x2="63" y2="38" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="85" y1="55" x2="79" y2="61" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Labels -->
    <text x="72.5" y="78" class="main-title">DUAL BLADES</text>
    <text x="72.5" y="93" class="sub-title">Starburst Stream</text>
    <rect x="22" y="103" width="101" height="2" rx="1" fill="#00FFFF"/>
  </g>

  <!-- ==================== SLOT 3: LUAU ARCHITECT ==================== -->
  <g class="slot3" transform="translate(330, 10)">
    <rect width="145" height="115" rx="10" fill="url(#cardBg)" stroke="#C084FC" stroke-width="1.3" filter="url(#glowPurple)"/>
    <!-- Rank Pill -->
    <rect x="36" y="8" width="73" height="16" rx="8" fill="url(#purple)"/>
    <text x="72.5" y="19.5" class="tag-text" fill="#0A0A12">GOD TIER</text>
    <!-- Vector Lightning Bolt / Code -->
    <circle cx="72.5" cy="48" r="16" fill="#1C102E" stroke="#C084FC" stroke-width="0.8"/>
    <path d="M74 38 L65 48 L71.5 48 L69 58 L80 47 L73.5 47 Z" fill="url(#purple)"/>
    <!-- Labels -->
    <text x="72.5" y="78" class="main-title">LUAU EXPLOITS</text>
    <text x="72.5" y="93" class="sub-title">Undetected Engine</text>
    <rect x="22" y="103" width="101" height="2" rx="1" fill="#C084FC"/>
  </g>

  <!-- ==================== SLOT 4: SYSTEM OVERRIDE ==================== -->
  <g class="slot4" transform="translate(490, 10)">
    <rect width="145" height="115" rx="10" fill="url(#cardBg)" stroke="#FF2E93" stroke-width="1.3" filter="url(#glowCrimson)"/>
    <!-- Rank Pill -->
    <rect x="36" y="8" width="73" height="16" rx="8" fill="url(#crimson)"/>
    <text x="72.5" y="19.5" class="tag-text" fill="#0A0A12">S+ STEALTH</text>
    <!-- Vector Shield -->
    <circle cx="72.5" cy="48" r="16" fill="#2E0E1F" stroke="#FF2E93" stroke-width="0.8"/>
    <path d="M72.5 39 L80 42 V48 C80 53 76.5 56.5 72.5 58 C68.5 56.5 65 53 65 48 V42 Z" fill="url(#crimson)" stroke="#FFFFFF" stroke-width="0.8"/>
    <!-- Labels -->
    <text x="72.5" y="78" class="main-title">ANTI-DETECTION</text>
    <text x="72.5" y="93" class="sub-title">Immortal Object Bypass</text>
    <rect x="22" y="103" width="101" height="2" rx="1" fill="#FF2E93"/>
  </g>
</svg>
